# Workspace root: lists the crates and sets rules shared by all of them.
#
# LEARN: A workspace is like a Maven multi-module project or an npm workspace.
# One root file, many crates. They share one `target/` folder and one lock file.

[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2021"
publish = false
license = "MIT"

# Rules for every crate that adds `[lints] workspace = true`.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

# Versions of shared libraries, in one place. Crates use `name.workspace = true`.
# chrono: no default features on purpose. Without the `clock` feature,
# `Utc::now()` does not exist, so the contract cannot read the real clock.

[workspace.dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
uuid = { version = "1", features = ["serde"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"